name: GitHub Advanced Security (Dependencias, Secretos y CodeQL)

on:
  workflow_call:

jobs:
  dependency-review:
    name: GHAS - Análisis de Dependencias
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Dependency Review (bloquea vulnerabilidades críticas)
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical

  secret-scanning:
    name: GHAS - Escaneo de Secretos
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks y escanear archivos actuales en busca de secretos
        shell: bash
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks detect --no-git --source=. --verbose --redact
          rm -f gitleaks gitleaks.tar.gz

      - name: Registrar resultado del escaneo de secretos con Gitleaks
        shell: bash
        run: |
          {
            echo "### GitHub Advanced Security - Escaneo de Secretos en CI (Gitleaks)"
            echo "- **Herramienta ejecutada en workflow:** Gitleaks v8.21.2 (\`gitleaks detect --no-git --source=. --verbose --redact\`)."
            echo "- **Resultado en el árbol de trabajo (\`${GITHUB_SHA::7}\`):** Escaneo completado sin hallazgos de secretos expuestos."
            echo "- **Alcance:** Este job valida únicamente el análisis con Gitleaks en GitHub Actions; los controles nativos de GitHub (Secret Scanning y Push Protection) se gestionan y verifican de forma independiente en la configuración del repositorio."
          } >> "$GITHUB_STEP_SUMMARY"

  codeql-analysis:
    name: GHAS - CodeQL SAST (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Ejecutar análisis CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript-ghas'
